services:
  # Frontend: Next.js standalone server
  frontend:
    build:
      context: .
      dockerfile: Dockerfile-front
    container_name: spring-react-frontend
    expose:
      - "3000"
    restart: unless-stopped
    env_file:
      - ./prod/frontend/.env.prod
    networks:
      - app-network
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile-back
    container_name: spring-react-backend
    ports:
      - "8082:8080"
    restart: unless-stopped
    env_file:
      - ./prod/backend/.env.prod
    environment:
      - PORT=${BACKEND_PORT:-8080}
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - db-data:/app/db
      - logs:/app/logs
    networks:
      - app-network

  # Reverse proxy для frontend и backend
  nginx:
    image: nginx:1.27-alpine
    container_name: spring-react-nginx
    ports:
      - "8085:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./prod/frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - frontend
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  logs:
    driver: local
